name: Drop & Block checks
on:
  pull_request:
    paths:
      - 'drop-and-block/**'
      - '.github/workflows/drop-and-block-checks.yml'
  push:
    branches:
      - 'drop-and-block/**'
    paths:
      - 'drop-and-block/**'
      - '.github/workflows/drop-and-block-checks.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drop-and-block
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
