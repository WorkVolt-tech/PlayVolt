name: Drop & Block Fire TV APK
on:
  push:
    branches:
      - main
      - 'drop-and-block/**'
    paths:
      - 'drop-and-block/firetv/**'
      - '.github/workflows/drop-and-block-firetv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Fire OS compatible signed test APK
        run: gradle -p drop-and-block/firetv --no-daemon :app:assembleDebug
      - name: Name download
        run: cp drop-and-block/firetv/app/build/outputs/apk/debug/app-debug.apk DropAndBlock-FireTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DropAndBlock-FireTV-APK
          path: DropAndBlock-FireTV.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to stable GitHub release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view drop-and-block-firetv >/dev/null 2>&1 ||
            gh release create drop-and-block-firetv --title 'Drop & Block — Fire TV App' --notes 'Android Fire OS Fire TV test installer. Opens the secure read-only TV pairing screen. Unsupported on Vega OS Fire Sticks. For future TV wrapper updates, uninstall an older test APK before installing a newly signed build.'
          gh release upload drop-and-block-firetv DropAndBlock-FireTV.apk --clobber
