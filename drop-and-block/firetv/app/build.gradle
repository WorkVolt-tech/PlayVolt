plugins {
    id 'com.android.application'
}

android {
    namespace 'com.playvolt.dropblock.firetv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.playvolt.dropblock.firetv'
        minSdk 25
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
