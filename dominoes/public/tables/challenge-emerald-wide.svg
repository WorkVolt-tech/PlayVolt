  <g transform="translate(26 26)"><use href="#cornerBlock" width="124" height="124"/><use href="#crown" x="24" y="18" width="72" height="66"/></g>
  <g transform="translate(1450 26)"><use href="#cornerBlock" width="124" height="124"/><use href="#crown" x="24" y="18" width="72" height="66"/></g>
  <g transform="translate(26 750)"><use href="#cornerBlock" width="124" height="124"/><use href="#crown" x="24" y="18" width="72" height="66"/></g>
  <g transform="translate(1450 750)"><use href="#cornerBlock" width="124" height="124"/><use href="#crown" x="24" y="18" width="72" height="66"/></g>
  <path d="M70 48 H1528" stroke="#fff8df" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 852 H1528" stroke="#fff8df" stroke-opacity="0.11" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M48 70 V830" stroke="#fff8df" stroke-opacity="0.12" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M1552 70 V830" stroke="#fff8df" stroke-opacity="0.08" stroke-width="2" stroke-linecap="round"/>
