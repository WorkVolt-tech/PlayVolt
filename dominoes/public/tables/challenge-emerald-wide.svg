      <rect x="22" y="22" width="126" height="126" rx="2" fill="none" stroke="#3b2a0d" stroke-width="3" opacity="0.7"/>
      <path d="M148 22 L148 58 L112 22 Z" fill="none" stroke="url(#gold)" stroke-width="8"/>
      <path d="M22 148 L58 148 L22 112 Z" fill="none" stroke="url(#gold)" stroke-width="8"/>
      <path d="M149 149 L121 149 L149 121" fill="none" stroke="url(#gold)" stroke-width="8"/>
      <path d="M22 58 L22 22 L58 22" fill="none" stroke="url(#gold)" stroke-width="8"/>
    </symbol>
    <symbol id="topDeco" viewBox="0 0 320 110">
      <path d="M0 60 H105 L145 18 H175 L215 60 H320" stroke="url(#gold)" stroke-width="10" fill="none" stroke-linejoin="miter"/>
      <path d="M32 60 H120 M50 42 H128 M68 24 H136" stroke="url(#gold)" stroke-width="7" fill="none"/>
      <path d="M288 60 H200 M270 42 H192 M252 24 H184" stroke="url(#gold)" stroke-width="7" fill="none"/>
    </symbol>
    <symbol id="sideDeco" viewBox="0 0 90 270">
      <path d="M45 0 V92" stroke="url(#gold)" stroke-width="10"/>
      <path d="M45 178 V270" stroke="url(#gold)" stroke-width="10"/>
      <path d="M20 100 H70 L45 135 Z" fill="none" stroke="url(#gold)" stroke-width="8"/>
      <use href="#rubyDiamond" x="45" y="135" width="36" height="44" transform="translate(45 135) scale(0.85) translate(-26 -34)"/>
