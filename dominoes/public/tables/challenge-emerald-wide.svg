<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b4712"/>
    <stop offset=".12" stop-color="#f7e5a8"/>
    <stop offset=".28" stop-color="#c9963b"/>
    <stop offset=".48" stop-color="#7f5619"/>
    <stop offset=".66" stop-color="#efcf70"/>
    <stop offset=".84" stop-color="#a87526"/>
    <stop offset="1" stop-color="#fff2bd"/>
  </linearGradient>
  <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f1d88c"/>
    <stop offset=".45" stop-color="#a77424"/>
    <stop offset="1" stop-color="#4c310d"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e5b4a"/>
    <stop offset=".28" stop-color="#0a3d34"/>
    <stop offset=".60" stop-color="#06251f"/>
    <stop offset="1" stop-color="#03120f"/>
  </linearGradient>
  <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6580"/>
    <stop offset=".30" stop-color="#b81333"/>
    <stop offset=".70" stop-color="#5b0718"/>
    <stop offset="1" stop-color="#210208"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx=".5" cy=".42" r=".72">
    <stop offset="0" stop-color="#0d4037" stop-opacity=".16"/>
    <stop offset=".55" stop-color="#0b2c27" stop-opacity=".04"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="centerMarble" width="380" height="270" patternUnits="userSpaceOnUse">
    <path d="M-40 240 C50 190 80 120 170 82 S290 54 420 -35" fill="none" stroke="#2b8d73" stroke-opacity=".08" stroke-width="3"/>
    <path d="M-20 260 C60 205 115 165 205 130 S310 88 420 20" fill="none" stroke="#d0efe7" stroke-opacity=".035" stroke-width="1.4"/>
  </pattern>
  <pattern id="edgeMarble" width="280" height="180" patternUnits="userSpaceOnUse">
    <path d="M-20 155 C45 115 75 55 150 35 S230 22 300 -20" fill="none" stroke="#61d3b2" stroke-opacity=".13" stroke-width="2.2"/>
    <path d="M-20 175 C50 130 100 110 170 75 S235 58 300 25" fill="none" stroke="#d7fff4" stroke-opacity=".06" stroke-width="1.2"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".55"/>
  </filter>
  <symbol id="rubyDiamond" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#ruby)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#ffd5df" stroke-opacity=".36" stroke-width="2"/>
    <path d="M17 43 H55 M36 14 V72" stroke="#ffd5df" stroke-opacity=".18" stroke-width="1.4"/>
  </symbol>
  <symbol id="crown" viewBox="0 0 120 96">
    <g filter="url(#shadow)">
      <path d="M12 60 L21 24 L43 42 L60 10 L77 42 L99 24 L108 60 L96 77 H24 Z" fill="url(#gold)"/>
      <path d="M24 77 H96 V88 H24 Z" fill="url(#goldDark)"/>
      <path d="M26 58 C46 48 74 48 94 58" fill="none" stroke="#fff0b6" stroke-opacity=".38" stroke-width="3"/>
      <circle cx="21" cy="24" r="6" fill="#f6e5af"/><circle cx="60" cy="10" r="6" fill="#f6e5af"/><circle cx="99" cy="24" r="6" fill="#f6e5af"/>
      <circle cx="21" cy="24" r="2.5" fill="#8f0d26"/><circle cx="60" cy="10" r="2.5" fill="#8f0d26"/><circle cx="99" cy="24" r="2.5" fill="#8f0d26"/>
    </g>
  </symbol>
  <symbol id="corner" viewBox="0 0 150 150">
    <rect x="4" y="4" width="142" height="142" rx="4" fill="#07120f" stroke="url(#gold)" stroke-width="8"/>
    <rect x="18" y="18" width="114" height="114" rx="3" fill="none" stroke="#6f4d18" stroke-width="2"/>
    <path d="M22 52 V22 H52 M128 52 V22 H98 M22 98 V128 H52 M128 98 V128 H98" fill="none" stroke="url(#gold)" stroke-width="8"/>
  </symbol>
</defs>

<rect width="1600" height="900" fill="#020504"/>
<rect x="18" y="18" width="1564" height="864" rx="10" fill="#06100d" stroke="#15251f" stroke-width="4"/>

<!-- emerald decorative band -->
<rect x="28" y="28" width="1544" height="844" rx="8" fill="url(#emerald)"/>
<rect x="28" y="28" width="1544" height="844" rx="8" fill="url(#edgeMarble)" opacity=".9"/>

<!-- playable black marble center -->
<rect x="126" y="106" width="1348" height="688" rx="2" fill="#070a0a"/>
<rect x="126" y="106" width="1348" height="688" rx="2" fill="url(#centerGlow)"/>
<rect x="126" y="106" width="1348" height="688" rx="2" fill="url(#centerMarble)"/>

<!-- refined rails -->
<rect x="30" y="30" width="1540" height="840" rx="8" fill="none" stroke="url(#gold)" stroke-width="8"/>
<rect x="41" y="41" width="1518" height="818" rx="6" fill="none" stroke="#fff2bd" stroke-opacity=".26" stroke-width="2"/>
<rect x="114" y="94" width="1372" height="712" rx="3" fill="none" stroke="url(#gold)" stroke-width="6"/>
<rect x="121" y="101" width="1358" height="698" rx="2" fill="none" stroke="#fff4cf" stroke-opacity=".16" stroke-width="1.5"/>

<!-- art deco top/bottom center -->
<g stroke="url(#gold)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
  <path d="M520 70 H690 L740 28 H860 L910 70 H1080" stroke-width="12"/>
  <path d="M560 52 H710 M590 35 H730 M1040 52 H890 M1010 35 H870" stroke-width="7"/>
  <path d="M520 830 H690 L740 872 H860 L910 830 H1080" stroke-width="12"/>
  <path d="M560 848 H710 M590 865 H730 M1040 848 H890 M1010 865 H870" stroke-width="7"/>
</g>

<!-- center crowns and ruby -->
<use href="#crown" x="742" y="14" width="116" height="92"/>
<use href="#rubyDiamond" x="773" y="68" width="54" height="64"/>
<use href="#crown" x="742" y="794" width="116" height="92"/>
<use href="#rubyDiamond" x="773" y="768" width="54" height="64"/>

<!-- side deco rails -->
<g stroke="url(#gold)" fill="none">
  <path d="M72 250 V350 M72 550 V650" stroke-width="10"/>
  <path d="M1528 250 V350 M1528 550 V650" stroke-width="10"/>
  <path d="M72 350 L47 390 L72 430 L97 390 Z" stroke-width="7"/>
  <path d="M1528 350 L1503 390 L1528 430 L1553 390 Z" stroke-width="7"/>
</g>
<use href="#rubyDiamond" x="47" y="360" width="50" height="60"/>
<use href="#rubyDiamond" x="1503" y="360" width="50" height="60"/>

<!-- corners -->
<g>
  <use href="#corner" x="28" y="28" width="120" height="120"/><use href="#crown" x="50" y="49" width="76" height="62"/>
  <use href="#corner" x="1452" y="28" width="120" height="120"/><use href="#crown" x="1474" y="49" width="76" height="62"/>
  <use href="#corner" x="28" y="752" width="120" height="120"/><use href="#crown" x="50" y="773" width="76" height="62"/>
  <use href="#corner" x="1452" y="752" width="120" height="120"/><use href="#crown" x="1474" y="773" width="76" height="62"/>
</g>

<!-- subtle corner transitions -->
<g fill="none" stroke="url(#gold)" stroke-width="7">
  <path d="M148 62 H190 L220 94"/>
  <path d="M1452 62 H1410 L1380 94"/>
  <path d="M148 838 H190 L220 806"/>
  <path d="M1452 838 H1410 L1380 806"/>
</g>

<!-- restrained highlights -->
<path d="M70 47 H1510" stroke="#fff7d5" stroke-opacity=".16" stroke-width="3" stroke-linecap="round"/>
<path d="M70 853 H1510" stroke="#fff7d5" stroke-opacity=".10" stroke-width="2.5" stroke-linecap="round"/>
</svg>