        <path d="M-36 11 C-15 4 15 4 36 11" stroke="#fff1bc" stroke-opacity="0.38" stroke-width="2" fill="none"/>
        <circle cx="-38" cy="-14" r="5" fill="#f7e8b8"/>
        <circle cx="0" cy="-30" r="5" fill="#f7e8b8"/>
        <circle cx="38" cy="-14" r="5" fill="#f7e8b8"/>
        <circle cx="-38" cy="-14" r="2" fill="#8e0b22"/>
        <circle cx="0" cy="-30" r="2" fill="#8e0b22"/>
        <circle cx="38" cy="-14" r="2" fill="#8e0b22"/>
