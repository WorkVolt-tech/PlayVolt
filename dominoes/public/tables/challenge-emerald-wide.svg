<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e4a14"/>
      <stop offset="10%" stop-color="#f4e0a2"/>
      <stop offset="22%" stop-color="#c8963f"/>
      <stop offset="45%" stop-color="#7b531a"/>
      <stop offset="68%" stop-color="#f1d47e"/>
      <stop offset="84%" stop-color="#a06e22"/>
      <stop offset="100%" stop-color="#fff0ba"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="50%" stop-color="#c99841"/>
      <stop offset="100%" stop-color="#6c4916"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3b35"/>
      <stop offset="28%" stop-color="#0d6b5d"/>
      <stop offset="58%" stop-color="#042820"/>
      <stop offset="100%" stop-color="#021510"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f10"/>
      <stop offset="50%" stop-color="#040707"/>
      <stop offset="100%" stop-color="#0a0f10"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6d87"/>
      <stop offset="28%" stop-color="#b30f31"/>
      <stop offset="70%" stop-color="#5b0819"/>
      <stop offset="100%" stop-color="#22030a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1"/>
      <feGaussianBlur stdDeviation="4" result="offBlur"/>
      <feComposite in="SourceGraphic" in2="offBlur" operator="arithmetic" k2="-1" k3="1"/>
    </filter>
    <radialGradient id="centerLight" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#0f5b4f" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#0b3d35" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.0"/>
    </radialGradient>
    <pattern id="centerVeins" width="400" height="300" patternUnits="userSpaceOnUse">
      <path d="M-20 220 C 80 180, 100 80, 220 30 S 370 40, 430 -20" stroke="#3ac7a3" stroke-opacity="0.13" stroke-width="2.3" fill="none"/>
      <path d="M-30 250 C 60 200, 160 120, 260 100 S 360 50, 430 20" stroke="#d5f9ef" stroke-opacity="0.10" stroke-width="1.1" fill="none"/>
      <path d="M10 310 C 110 250, 130 160, 270 140 S 380 130, 460 70" stroke="#2da68b" stroke-opacity="0.12" stroke-width="1.7" fill="none"/>
    </pattern>
    <pattern id="emeraldVeins" width="320" height="200" patternUnits="userSpaceOnUse">
      <path d="M-10 120 C 60 80, 100 20, 180 10 S 260 20, 330 -30" stroke="#6ce5c3" stroke-opacity="0.15" stroke-width="2.2" fill="none"/>
      <path d="M-20 150 C 70 90, 120 110, 200 50 S 260 60, 340 30" stroke="#ddfff8" stroke-opacity="0.09" stroke-width="1.2" fill="none"/>
      <path d="M0 190 C 50 130, 120 150, 220 100 S 290 100, 350 80" stroke="#12967b" stroke-opacity="0.12" stroke-width="1.8" fill="none"/>
    </pattern>
    <symbol id="rubyDiamond" viewBox="-26 -34 52 68">
