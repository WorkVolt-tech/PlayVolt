  <rect width="1600" height="900" fill="#020605"/>
  <rect x="14" y="14" width="1572" height="872" rx="10" fill="#07110f" stroke="#0b1b17" stroke-width="4"/>
  <rect x="26" y="26" width="1548" height="848" rx="8" fill="url(#emerald)"/>
  <rect x="26" y="26" width="1548" height="848" rx="8" fill="url(#emeraldVeins)" opacity="0.95"/>
  <rect x="93" y="94" width="1414" height="712" rx="4" fill="url(#centerGrad)" filter="url(#innerShadow)"/>
  <rect x="93" y="94" width="1414" height="712" rx="4" fill="url(#centerLight)"/>
  <rect x="93" y="94" width="1414" height="712" rx="4" fill="url(#centerVeins)" opacity="0.95"/>
  <rect x="28" y="28" width="1544" height="844" rx="8" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <rect x="40" y="40" width="1520" height="820" rx="6" fill="none" stroke="#fff0bc" stroke-opacity="0.28" stroke-width="2"/>
  <rect x="82" y="83" width="1436" height="734" rx="4" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <rect x="89" y="90" width="1422" height="720" rx="3" fill="none" stroke="#fff4cf" stroke-opacity="0.18" stroke-width="1.5"/>
  <g transform="translate(640 18)">
