      <path d="M0 -19 L10 0 L0 19 L-10 0 Z" fill="none" stroke="#ffd1dc" stroke-opacity="0.45" stroke-width="1.4"/>
      <path d="M-10 -1 H10 M0 -19 V19" stroke="#ffd1dc" stroke-opacity="0.20" stroke-width="1"/>
    </symbol>
    <symbol id="crown" viewBox="-55 -50 110 100">
