<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
<defs>
  <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5f421d"/>
    <stop offset=".12" stop-color="#e8c98c"/>
    <stop offset=".28" stop-color="#b98343"/>
    <stop offset=".48" stop-color="#6c481f"/>
    <stop offset=".66" stop-color="#d7ad6d"/>
    <stop offset=".84" stop-color="#8d5d2c"/>
    <stop offset="1" stop-color="#f3d9a1"/>
  </linearGradient>
  <linearGradient id="bronzeDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9b678"/>
    <stop offset=".45" stop-color="#8f5d2a"/>
    <stop offset="1" stop-color="#3f2811"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#16877e"/>
    <stop offset=".30" stop-color="#0b5a55"/>
    <stop offset=".68" stop-color="#073331"/>
    <stop offset="1" stop-color="#031716"/>
  </linearGradient>
  <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6cf1df"/>
    <stop offset=".30" stop-color="#22b8aa"/>
    <stop offset=".70" stop-color="#0a6c65"/>
    <stop offset="1" stop-color="#03322e"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx=".5" cy=".44" r=".76">
    <stop offset="0" stop-color="#0c6059" stop-opacity=".12"/>
    <stop offset=".58" stop-color="#083a36" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="centerLeather" width="330" height="255" patternUnits="userSpaceOnUse">
    <path d="M-50 250 C60 190 105 135 205 92 S330 58 470 -35" fill="none" stroke="#4ea99f" stroke-opacity=".05" stroke-width="2.6"/>
    <path d="M-25 278 C65 220 135 175 235 135 S350 92 470 18" fill="none" stroke="#d5fffa" stroke-opacity=".022" stroke-width="1.1"/>
  </pattern>
  <pattern id="edgeTexture" width="260" height="170" patternUnits="userSpaceOnUse">
    <path d="M-20 145 C40 108 70 52 138 33 S215 20 280 -16" fill="none" stroke="#63c6bb" stroke-opacity=".10" stroke-width="2"/>
    <path d="M-20 165 C46 125 91 103 160 71 S222 53 290 24" fill="none" stroke="#e5fffb" stroke-opacity=".04" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".48"/>
  </filter>
  <symbol id="tealGem" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#gem)" stroke="url(#bronze)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#d9fffa" stroke-opacity=".34" stroke-width="2"/>
  </symbol>
  <symbol id="decoDiamond" viewBox="0 0 120 96">
    <g filter="url(#shadow)">
      <rect x="28" y="16" width="64" height="64" rx="8" transform="rotate(45 60 48)" fill="url(#teal)" stroke="url(#bronze)" stroke-width="5"/>
      <rect x="40" y="28" width="40" height="40" rx="5" transform="rotate(45 60 48)" fill="none" stroke="#e6fffb" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="60" cy="48" r="8" fill="url(#gem)" stroke="#f4e0b1" stroke-width="1.8"/>
    </g>
  </symbol>
  <symbol id="corner" viewBox="0 0 150 150">
    <rect x="4" y="4" width="142" height="142" rx="4" fill="#07110f" stroke="url(#bronze)" stroke-width="8"/>
    <rect x="18" y="18" width="114" height="114" rx="3" fill="none" stroke="#5c4527" stroke-width="2"/>
    <path d="M22 52 V22 H52 M128 52 V22 H98 M22 98 V128 H52 M128 98 V128 H98" fill="none" stroke="url(#bronze)" stroke-width="8"/>
  </symbol>
</defs>

<rect width="900" height="1350" fill="#020605"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="#08110f" stroke="#14231f" stroke-width="4"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#teal)"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#edgeTexture)" opacity=".76"/>

<!-- large usable play surface -->
<rect x="66" y="90" width="768" height="1170" rx="3" fill="#06100f"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerGlow)"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerLeather)"/>

<!-- brushed bronze rails -->
<rect x="22" y="22" width="856" height="1306" rx="8" fill="none" stroke="url(#bronze)" stroke-width="8"/>
<rect x="32" y="32" width="836" height="1286" rx="6" fill="none" stroke="#f4deb0" stroke-opacity=".22" stroke-width="2"/>
<rect x="58" y="82" width="784" height="1186" rx="4" fill="none" stroke="url(#bronze)" stroke-width="5"/>
<rect x="64" y="88" width="772" height="1174" rx="3" fill="none" stroke="#fff4d8" stroke-opacity=".12" stroke-width="1.4"/>

<!-- modern deco centerpiece -->
<g stroke="url(#bronze)" fill="none" stroke-linejoin="miter">
  <path d="M265 72 H374 L404 40 H496 L526 72 H635" stroke-width="9"/>
  <path d="M295 56 H378 M605 56 H522" stroke-width="6"/>
  <path d="M265 1278 H374 L404 1310 H496 L526 1278 H635" stroke-width="9"/>
  <path d="M295 1294 H378 M605 1294 H522" stroke-width="6"/>
</g>
<use href="#decoDiamond" x="418" y="27" width="64" height="52"/>
<use href="#tealGem" x="432" y="68" width="36" height="44"/>
<use href="#decoDiamond" x="418" y="1271" width="64" height="52"/>
<use href="#tealGem" x="432" y="1238" width="36" height="44"/>

<!-- side accents -->
<use href="#tealGem" x="30" y="651" width="34" height="48"/>
<use href="#tealGem" x="836" y="651" width="34" height="48"/>

<!-- compact corners -->
<use href="#corner" x="20" y="20" width="86" height="86"/>
<use href="#decoDiamond" x="28" y="34" width="64" height="52"/>
<use href="#corner" x="794" y="20" width="86" height="86"/>
<use href="#decoDiamond" x="802" y="34" width="64" height="52"/>
<use href="#corner" x="20" y="1244" width="86" height="86"/>
<use href="#decoDiamond" x="28" y="1258" width="64" height="52"/>
<use href="#corner" x="794" y="1244" width="86" height="86"/>
<use href="#decoDiamond" x="802" y="1258" width="64" height="52"/>

<path d="M60 36 H840" stroke="#fff2d6" stroke-opacity=".12" stroke-width="2.5" stroke-linecap="round"/>
</svg>