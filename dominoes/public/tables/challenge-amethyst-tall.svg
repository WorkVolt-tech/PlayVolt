<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
<defs>
  <linearGradient id="smokyGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#5e451d"/>
    <stop offset=".12" stop-color="#ead39a"/>
    <stop offset=".28" stop-color="#b98a47"/>
    <stop offset=".48" stop-color="#6f5024"/>
    <stop offset=".66" stop-color="#d8b36f"/>
    <stop offset=".84" stop-color="#8b632e"/>
    <stop offset="1" stop-color="#f2dca7"/>
  </linearGradient>
  <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dac084"/>
    <stop offset=".45" stop-color="#8d662f"/>
    <stop offset="1" stop-color="#3b2a12"/>
  </linearGradient>
  <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#633d8f"/>
    <stop offset=".30" stop-color="#3d2460"/>
    <stop offset=".68" stop-color="#241438"/>
    <stop offset="1" stop-color="#0d0715"/>
  </linearGradient>
  <linearGradient id="amethyst" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c9a4ff"/>
    <stop offset=".28" stop-color="#9c63db"/>
    <stop offset=".66" stop-color="#5d2c9b"/>
    <stop offset="1" stop-color="#261043"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx=".5" cy=".44" r=".76">
    <stop offset="0" stop-color="#55307f" stop-opacity=".13"/>
    <stop offset=".58" stop-color="#321d4c" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="centerStone" width="330" height="255" patternUnits="userSpaceOnUse">
    <path d="M-50 250 C60 190 105 135 205 92 S330 58 470 -35" fill="none" stroke="#8962aa" stroke-opacity=".05" stroke-width="2.6"/>
    <path d="M-25 278 C65 220 135 175 235 135 S350 92 470 18" fill="none" stroke="#eadfff" stroke-opacity=".022" stroke-width="1.1"/>
  </pattern>
  <pattern id="edgeStone" width="260" height="170" patternUnits="userSpaceOnUse">
    <path d="M-20 145 C40 108 70 52 138 33 S215 20 280 -16" fill="none" stroke="#b28ae0" stroke-opacity=".10" stroke-width="2"/>
    <path d="M-20 165 C46 125 91 103 160 71 S222 53 290 24" fill="none" stroke="#f0e7ff" stroke-opacity=".04" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
  </filter>
  <symbol id="crystal" viewBox="0 0 120 96">
    <g filter="url(#shadow)">
      <path d="M60 8 L88 30 L82 66 L60 88 L38 66 L32 30 Z" fill="url(#amethyst)" stroke="url(#smokyGold)" stroke-width="5"/>
      <path d="M60 8 V88 M32 30 H88 M38 66 H82" fill="none" stroke="#f4eaff" stroke-opacity=".22" stroke-width="2"/>
      <ellipse cx="52" cy="27" rx="10" ry="5" fill="#fff" opacity=".18"/>
    </g>
  </symbol>
  <symbol id="amethystGem" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#amethyst)" stroke="url(#smokyGold)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#eadcff" stroke-opacity=".34" stroke-width="2"/>
  </symbol>
  <symbol id="corner" viewBox="0 0 150 150">
    <rect x="4" y="4" width="142" height="142" rx="4" fill="#0e0815" stroke="url(#smokyGold)" stroke-width="8"/>
    <rect x="18" y="18" width="114" height="114" rx="3" fill="none" stroke="#5d4929" stroke-width="2"/>
    <path d="M22 52 V22 H52 M128 52 V22 H98 M22 98 V128 H52 M128 98 V128 H98" fill="none" stroke="url(#smokyGold)" stroke-width="8"/>
  </symbol>
</defs>

<rect width="900" height="1350" fill="#030205"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="#100817" stroke="#1d1228" stroke-width="4"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#plum)"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#edgeStone)" opacity=".76"/>

<!-- large usable play surface -->
<rect x="66" y="90" width="768" height="1170" rx="3" fill="#09070d"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerGlow)"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerStone)"/>

<!-- smoky-gold rails -->
<rect x="22" y="22" width="856" height="1306" rx="8" fill="none" stroke="url(#smokyGold)" stroke-width="8"/>
<rect x="32" y="32" width="836" height="1286" rx="6" fill="none" stroke="#f3e1b6" stroke-opacity=".22" stroke-width="2"/>
<rect x="58" y="82" width="784" height="1186" rx="4" fill="none" stroke="url(#smokyGold)" stroke-width="5"/>
<rect x="64" y="88" width="772" height="1174" rx="3" fill="none" stroke="#fff2d8" stroke-opacity=".12" stroke-width="1.4"/>

<!-- restrained crystalline centerpiece -->
<g stroke="url(#smokyGold)" fill="none" stroke-linejoin="miter">
  <path d="M265 72 H374 L404 40 H496 L526 72 H635" stroke-width="9"/>
  <path d="M295 56 H378 M605 56 H522" stroke-width="6"/>
  <path d="M265 1278 H374 L404 1310 H496 L526 1278 H635" stroke-width="9"/>
  <path d="M295 1294 H378 M605 1294 H522" stroke-width="6"/>
</g>
<use href="#crystal" x="418" y="26" width="64" height="54"/>
<use href="#amethystGem" x="432" y="68" width="36" height="44"/>
<use href="#crystal" x="418" y="1270" width="64" height="54"/>
<use href="#amethystGem" x="432" y="1238" width="36" height="44"/>

<!-- side accents -->
<use href="#amethystGem" x="30" y="651" width="34" height="48"/>
<use href="#amethystGem" x="836" y="651" width="34" height="48"/>

<!-- compact corners -->
<use href="#corner" x="20" y="20" width="86" height="86"/>
<use href="#crystal" x="28" y="33" width="64" height="54"/>
<use href="#corner" x="794" y="20" width="86" height="86"/>
<use href="#crystal" x="802" y="33" width="64" height="54"/>
<use href="#corner" x="20" y="1244" width="86" height="86"/>
<use href="#crystal" x="28" y="1257" width="64" height="54"/>
<use href="#corner" x="794" y="1244" width="86" height="86"/>
<use href="#crystal" x="802" y="1257" width="64" height="54"/>

<path d="M60 36 H840" stroke="#f5ead0" stroke-opacity=".12" stroke-width="2.5" stroke-linecap="round"/>
</svg>