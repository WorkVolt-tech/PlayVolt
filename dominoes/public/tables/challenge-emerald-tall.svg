<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
  <defs>
    <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f4b14"/>
      <stop offset=".12" stop-color="#fff4b4"/>
      <stop offset=".26" stop-color="#d7ae4d"/>
      <stop offset=".44" stop-color="#8e641e"/>
      <stop offset=".62" stop-color="#f6d982"/>
      <stop offset=".78" stop-color="#9b6c22"/>
      <stop offset="1" stop-color="#fff0a6"/>
    </linearGradient>

    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ca" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#d4a842" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5d3d10" stop-opacity=".9"/>
    </linearGradient>

    <linearGradient id="emeraldGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e0a0"/>
      <stop offset=".25" stop-color="#087650"/>
      <stop offset=".62" stop-color="#073927"/>
      <stop offset="1" stop-color="#01150e"/>
    </linearGradient>

    <linearGradient id="rubyGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b85"/>
      <stop offset=".3" stop-color="#b91f40"/>
      <stop offset=".7" stop-color="#5b0b20"/>
      <stop offset="1" stop-color="#21030b"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx=".5" cy=".42" r=".72">
      <stop offset="0" stop-color="#0d6e4d" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#0d6e4d" stop-opacity=".04"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>

    <pattern id="marble" width="260" height="220" patternUnits="userSpaceOnUse">
      <path d="M-20 180 C50 130 60 60 150 45 C205 36 230 10 280 -20" fill="none" stroke="#2d6b54" stroke-opacity=".10" stroke-width="8"/>
      <path d="M-30 205 C60 145 92 115 174 92 C220 79 250 52 285 20" fill="none" stroke="#d7ae4d" stroke-opacity=".045" stroke-width="3"/>
    </pattern>

    <filter id="metalShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".7"/>
    </filter>

    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="sparkleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

