<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6b4712"/>
    <stop offset=".12" stop-color="#f7e5a8"/>
    <stop offset=".28" stop-color="#c9963b"/>
    <stop offset=".48" stop-color="#7f5619"/>
    <stop offset=".66" stop-color="#efcf70"/>
    <stop offset=".84" stop-color="#a87526"/>
    <stop offset="1" stop-color="#fff2bd"/>
  </linearGradient>
  <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f1d88c"/>
    <stop offset=".45" stop-color="#a77424"/>
    <stop offset="1" stop-color="#4c310d"/>
  </linearGradient>
  <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f5a49"/>
    <stop offset=".32" stop-color="#0a4035"/>
    <stop offset=".70" stop-color="#05251f"/>
    <stop offset="1" stop-color="#03130f"/>
  </linearGradient>
  <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6580"/>
    <stop offset=".30" stop-color="#b81333"/>
    <stop offset=".70" stop-color="#5b0718"/>
    <stop offset="1" stop-color="#210208"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx=".5" cy=".44" r=".75">
    <stop offset="0" stop-color="#0b463b" stop-opacity=".13"/>
    <stop offset=".58" stop-color="#082d27" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="centerMarble" width="320" height="250" patternUnits="userSpaceOnUse">
    <path d="M-40 250 C55 195 90 120 190 75 S310 48 450 -40" fill="none" stroke="#2b8d73" stroke-opacity=".065" stroke-width="2.8"/>
    <path d="M-20 275 C70 215 125 168 220 128 S330 85 450 20" fill="none" stroke="#d0efe7" stroke-opacity=".028" stroke-width="1.2"/>
  </pattern>
  <pattern id="edgeMarble" width="260" height="170" patternUnits="userSpaceOnUse">
    <path d="M-20 145 C40 108 70 52 138 33 S215 20 280 -16" fill="none" stroke="#61d3b2" stroke-opacity=".12" stroke-width="2.1"/>
    <path d="M-20 165 C46 125 91 103 160 71 S222 53 290 24" fill="none" stroke="#d7fff4" stroke-opacity=".05" stroke-width="1.1"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
  </filter>
  <symbol id="rubyDiamond" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#ruby)" stroke="url(#gold)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#ffd5df" stroke-opacity=".36" stroke-width="2"/>
  </symbol>
  <symbol id="crown" viewBox="0 0 120 96">
    <g filter="url(#shadow)">
      <path d="M12 60 L21 24 L43 42 L60 10 L77 42 L99 24 L108 60 L96 77 H24 Z" fill="url(#gold)"/>
      <path d="M24 77 H96 V88 H24 Z" fill="url(#goldDark)"/>
      <path d="M26 58 C46 48 74 48 94 58" fill="none" stroke="#fff0b6" stroke-opacity=".34" stroke-width="3"/>
      <circle cx="21" cy="24" r="6" fill="#f6e5af"/><circle cx="60" cy="10" r="6" fill="#f6e5af"/><circle cx="99" cy="24" r="6" fill="#f6e5af"/>
      <circle cx="21" cy="24" r="2.5" fill="#8f0d26"/><circle cx="60" cy="10" r="2.5" fill="#8f0d26"/><circle cx="99" cy="24" r="2.5" fill="#8f0d26"/>
    </g>
  </symbol>
  <symbol id="corner" viewBox="0 0 150 150">
    <rect x="4" y="4" width="142" height="142" rx="4" fill="#07120f" stroke="url(#gold)" stroke-width="8"/>
    <rect x="18" y="18" width="114" height="114" rx="3" fill="none" stroke="#6f4d18" stroke-width="2"/>
    <path d="M22 52 V22 H52 M128 52 V22 H98 M22 98 V128 H52 M128 98 V128 H98" fill="none" stroke="url(#gold)" stroke-width="8"/>
  </symbol>
</defs>

<!-- Entire logical board is usable; artwork no longer defines a smaller inner table. -->
<rect width="900" height="1350" fill="#020504"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#emerald)"/>
<rect x="18" y="18" width="864" height="1314" rx="10" fill="url(#edgeMarble)" opacity=".82"/>

<!-- Play surface extends almost to the actual board edge so chains never appear outside the table. -->
<rect x="66" y="90" width="768" height="1170" rx="3" fill="#060a09"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerGlow)"/>
<rect x="66" y="90" width="768" height="1170" rx="3" fill="url(#centerMarble)"/>

<!-- restrained outer rails only -->
<rect x="22" y="22" width="856" height="1306" rx="8" fill="none" stroke="url(#gold)" stroke-width="8"/>
<rect x="32" y="32" width="836" height="1286" rx="6" fill="none" stroke="#fff2bd" stroke-opacity=".24" stroke-width="2"/>
<rect x="58" y="82" width="784" height="1186" rx="4" fill="none" stroke="url(#gold)" stroke-width="5"/>
<rect x="64" y="88" width="772" height="1174" rx="3" fill="none" stroke="#fff4cf" stroke-opacity=".13" stroke-width="1.4"/>

<!-- compact top/bottom centerpiece kept inside border band -->
<g stroke="url(#gold)" fill="none" stroke-linejoin="miter">
  <path d="M265 72 H378 L406 40 H494 L522 72 H635" stroke-width="9"/>
  <path d="M295 56 H382 M605 56 H518" stroke-width="6"/>
  <path d="M265 1278 H378 L406 1310 H494 L522 1278 H635" stroke-width="9"/>
  <path d="M295 1294 H382 M605 1294 H518" stroke-width="6"/>
</g>
<use href="#crown" x="418" y="27" width="64" height="52"/>
<use href="#rubyDiamond" x="431" y="69" width="38" height="46"/>
<use href="#crown" x="418" y="1271" width="64" height="52"/>
<use href="#rubyDiamond" x="431" y="1235" width="38" height="46"/>

<!-- side accents sit in the narrow rail, not inside play space -->
<use href="#rubyDiamond" x="30" y="651" width="34" height="48"/>
<use href="#rubyDiamond" x="836" y="651" width="34" height="48"/>

<!-- compact corners -->
<use href="#corner" x="20" y="20" width="86" height="86"/>
<use href="#crown" x="34" y="33" width="64" height="52"/>
<use href="#corner" x="794" y="20" width="86" height="86"/>
<use href="#crown" x="808" y="33" width="64" height="52"/>
<use href="#corner" x="20" y="1244" width="86" height="86"/>
<use href="#crown" x="34" y="1257" width="64" height="52"/>
<use href="#corner" x="794" y="1244" width="86" height="86"/>
<use href="#crown" x="808" y="1257" width="64" height="52"/>

<path d="M60 36 H840" stroke="#fff7d5" stroke-opacity=".13" stroke-width="2.5" stroke-linecap="round"/>
</svg>