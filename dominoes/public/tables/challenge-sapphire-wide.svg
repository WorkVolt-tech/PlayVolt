<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#46505f"/>
    <stop offset=".10" stop-color="#ffffff"/>
    <stop offset=".24" stop-color="#cfd7e3"/>
    <stop offset=".44" stop-color="#6b7688"/>
    <stop offset=".64" stop-color="#edf2f8"/>
    <stop offset=".82" stop-color="#8f99aa"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="silverDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef3f8"/>
    <stop offset=".46" stop-color="#9ba5b5"/>
    <stop offset="1" stop-color="#3d4654"/>
  </linearGradient>
  <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2863d8"/>
    <stop offset=".30" stop-color="#14398c"/>
    <stop offset=".68" stop-color="#0b204f"/>
    <stop offset="1" stop-color="#040a1c"/>
  </linearGradient>
  <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6f8a"/>
    <stop offset=".30" stop-color="#bb2346"/>
    <stop offset=".70" stop-color="#5b0b20"/>
    <stop offset="1" stop-color="#24030b"/>
  </linearGradient>
  <radialGradient id="centerGlow" cx=".5" cy=".44" r=".76">
    <stop offset="0" stop-color="#173a87" stop-opacity=".13"/>
    <stop offset=".58" stop-color="#10224b" stop-opacity=".035"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <pattern id="centerStone" width="420" height="290" patternUnits="userSpaceOnUse">
    <path d="M-40 250 C55 195 90 120 190 75 S310 48 450 -40" fill="none" stroke="#527cd5" stroke-opacity=".06" stroke-width="2.8"/>
    <path d="M-20 275 C70 215 125 168 220 128 S330 85 450 20" fill="none" stroke="#dbe7ff" stroke-opacity=".028" stroke-width="1.2"/>
  </pattern>
  <pattern id="edgeStone" width="260" height="170" patternUnits="userSpaceOnUse">
    <path d="M-20 145 C40 108 70 52 138 33 S215 20 280 -16" fill="none" stroke="#6f96ef" stroke-opacity=".12" stroke-width="2.1"/>
    <path d="M-20 165 C46 125 91 103 160 71 S222 53 290 24" fill="none" stroke="#eef4ff" stroke-opacity=".05" stroke-width="1.1"/>
  </pattern>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".5"/>
  </filter>
  <symbol id="rubyGem" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#ruby)" stroke="url(#silver)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#ffd9e2" stroke-opacity=".36" stroke-width="2"/>
  </symbol>
  <symbol id="sapphireGem" viewBox="0 0 72 86">
    <path d="M36 3 L67 43 L36 83 L5 43 Z" fill="url(#sapphire)" stroke="url(#silver)" stroke-width="6"/>
    <path d="M36 14 L56 43 L36 72 L16 43 Z" fill="none" stroke="#dce9ff" stroke-opacity=".36" stroke-width="2"/>
  </symbol>
  <symbol id="crest" viewBox="0 0 120 96">
    <g filter="url(#shadow)">
      <path d="M14 48 L34 18 H86 L106 48 L86 78 H34 Z" fill="url(#sapphire)" stroke="url(#silver)" stroke-width="5"/>
      <path d="M34 18 L60 48 L86 18 M14 48 H106 M34 78 L60 48 L86 78" fill="none" stroke="#eef4ff" stroke-opacity=".20" stroke-width="2"/>
      <circle cx="60" cy="48" r="11" fill="url(#ruby)" stroke="#f7f9fc" stroke-width="2"/>
      <circle cx="57" cy="44" r="3" fill="#fff" opacity=".42"/>
    </g>
  </symbol>
  <symbol id="corner" viewBox="0 0 150 150">
    <rect x="4" y="4" width="142" height="142" rx="4" fill="#080c14" stroke="url(#silver)" stroke-width="8"/>
    <rect x="18" y="18" width="114" height="114" rx="3" fill="none" stroke="#566174" stroke-width="2"/>
    <path d="M22 52 V22 H52 M128 52 V22 H98 M22 98 V128 H52 M128 98 V128 H98" fill="none" stroke="url(#silver)" stroke-width="8"/>
  </symbol>
</defs>

<rect width="1600" height="900" fill="#02040a"/>
<rect x="18" y="18" width="1564" height="864" rx="10" fill="#08101e" stroke="#121a2b" stroke-width="4"/>
<rect x="18" y="18" width="1564" height="864" rx="10" fill="url(#sapphire)"/>
<rect x="18" y="18" width="1564" height="864" rx="10" fill="url(#edgeStone)" opacity=".80"/>

<!-- large actual playable surface -->
<rect x="64" y="76" width="1472" height="748" rx="3" fill="#060910"/>
<rect x="64" y="76" width="1472" height="748" rx="3" fill="url(#centerGlow)"/>
<rect x="64" y="76" width="1472" height="748" rx="3" fill="url(#centerStone)"/>

<!-- restrained polished silver rails -->
<rect x="22" y="22" width="1556" height="856" rx="8" fill="none" stroke="url(#silver)" stroke-width="8"/>
<rect x="32" y="32" width="1536" height="836" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".26" stroke-width="2"/>
<rect x="56" y="68" width="1488" height="764" rx="4" fill="none" stroke="url(#silver)" stroke-width="5"/>
<rect x="62" y="74" width="1476" height="752" rx="3" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.4"/>

<!-- compact geometric centerpiece -->
<g stroke="url(#silver)" fill="none" stroke-linejoin="miter">
  <path d="M550 66 H708 L746 34 H854 L892 66 H1050" stroke-width="10"/>
  <path d="M590 50 H716 M1010 50 H884" stroke-width="6"/>
  <path d="M550 834 H708 L746 866 H854 L892 834 H1050" stroke-width="10"/>
  <path d="M590 850 H716 M1010 850 H884" stroke-width="6"/>
</g>
<use href="#crest" x="763" y="21" width="74" height="58"/>
<use href="#rubyGem" x="782" y="62" width="36" height="44"/>
<use href="#crest" x="763" y="821" width="74" height="58"/>
<use href="#rubyGem" x="782" y="794" width="36" height="44"/>

<!-- side gem accents remain in the rail -->
<use href="#sapphireGem" x="30" y="426" width="34" height="48"/>
<use href="#rubyGem" x="1536" y="426" width="34" height="48"/>

<!-- compact corners -->
<use href="#corner" x="20" y="20" width="92" height="92"/>
<use href="#crest" x="30" y="34" width="74" height="58"/>
<use href="#corner" x="1488" y="20" width="92" height="92"/>
<use href="#crest" x="1498" y="34" width="74" height="58"/>
<use href="#corner" x="20" y="788" width="92" height="92"/>
<use href="#crest" x="30" y="802" width="74" height="58"/>
<use href="#corner" x="1488" y="788" width="92" height="92"/>
<use href="#crest" x="1498" y="802" width="74" height="58"/>

<path d="M60 36 H1540" stroke="#ffffff" stroke-opacity=".14" stroke-width="2.5" stroke-linecap="round"/>
</svg>